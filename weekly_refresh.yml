name: Weekly Labor Market Refresh

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 6 AM UTC
  workflow_dispatch:        # Also allows manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run BLS refresh script
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: python scripts/weekly_refresh.py

      - name: Commit updated data
        run: |
          git config user.name  "UB Labor Market Bot"
          git config user.email "bot@ubalt.edu"
          git add data/labor_market.json
          git diff --staged --quiet || git commit -m "chore: weekly labor market refresh $(date +'%Y-%m-%d')"
          git push
